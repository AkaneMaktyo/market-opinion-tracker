server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

market-data:
  # Options: bitget, okx, binance, bybit, all. Tried in order.
  startup-sync-enabled: ${MARKET_DATA_STARTUP_SYNC_ENABLED:false}
  providers:
    - yahoo
    - bitget

celebrity-data:
  enabled: ${CELEBRITY_DATA_ENABLED:true}
  startup-sync-enabled: ${CELEBRITY_DATA_STARTUP_SYNC_ENABLED:true}
  ark-enabled: ${CELEBRITY_DATA_ARK_ENABLED:true}
  history-limit: ${CELEBRITY_DATA_HISTORY_LIMIT:8}
  symbol-resolution-limit: ${CELEBRITY_DATA_SYMBOL_RESOLUTION_LIMIT:24}
  # SEC 要求应用身份和可联系邮箱；生产环境必须填写真实值。
  sec-user-agent: ${SEC_USER_AGENT:}
  # 优先使用独立代理，未配置时复用服务器已有的 HTTP / YouTube 代理。
  proxy-url: ${CELEBRITY_DATA_PROXY_URL:${HTTP_PROXY_URL:${YOUTUBE_PROXY_URL:}}}
  ark-holdings-url: ${ARKK_HOLDINGS_URL:https://assets.ark-funds.com/fund-documents/funds-etf-csv/ARK_INNOVATION_ETF_ARKK_HOLDINGS.csv}

trading:
  bitget:
    enabled: ${BITGET_ENABLED:false}
    demo: ${BITGET_PAPER_TRADING:true}
    base-url: ${BITGET_BASE_URL:https://api.bitget.com}
    api-key: ${BITGET_API_KEY:}
    api-secret: ${BITGET_API_SECRET:}
    passphrase: ${BITGET_PASSPHRASE:}
    product-type: ${BITGET_PRODUCT_TYPE:USDT-FUTURES}
    margin-coin: ${BITGET_MARGIN_COIN:USDT}
  binance:
    enabled: ${BINANCE_SPOT_ENABLED:false}
    paper: ${BINANCE_SPOT_PAPER_TRADING:true}
    environment: ${BINANCE_SPOT_ENVIRONMENT:testnet}
    base-url: ${BINANCE_SPOT_BASE_URL:}
    proxy-url: ${BINANCE_SPOT_PROXY_URL:}
    api-key: ${BINANCE_SPOT_API_KEY:}
    api-secret: ${BINANCE_SPOT_API_SECRET:}
    key-type: ${BINANCE_SPOT_KEY_TYPE:HMAC}
    private-key-path: ${BINANCE_SPOT_PRIVATE_KEY_PATH:}
    private-key-passphrase: ${BINANCE_SPOT_PRIVATE_KEY_PASSPHRASE:}
    recv-window: ${BINANCE_SPOT_RECV_WINDOW:5000}
    reconcile-ms: ${BINANCE_SPOT_RECONCILE_MS:15000}
    positions-refresh-ms: ${BINANCE_SPOT_POSITIONS_REFRESH_MS:30000}
    positions-initial-delay-ms: ${BINANCE_SPOT_POSITIONS_INITIAL_DELAY_MS:1000}

app:
  positions:
    auto-rebuild-enabled: ${POSITIONS_AUTO_REBUILD_ENABLED:true}

llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  wxpusher-enabled: ${LLM_WXPUSHER_ENABLED:true}
  youtube-auto-import-enabled: ${LLM_YOUTUBE_AUTO_IMPORT_ENABLED:false}

price-alert:
  deepseek:
    base-url: ${PRICE_ALERT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${PRICE_ALERT_DEEPSEEK_API_KEY:}

wxpusher:
  ocr:
    enabled: ${WXPUSHER_OCR_ENABLED:true}
    group-name: ${WXPUSHER_OCR_GROUP_NAME:顺哥vip小群}
    provider: ${WXPUSHER_OCR_PROVIDER:auto}
    endpoint: ${WXPUSHER_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}
    max-images: ${WXPUSHER_OCR_MAX_IMAGES:10}
    tesseract-command: ${TESSERACT_COMMAND:tesseract}
    tesseract-language: ${TESSERACT_LANGUAGE:chi_sim+eng}

spring:
  application:
    name: market-opinion-tracker
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 15000
      validation-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 120000
      keepalive-time: 30000
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 30000
        tcpKeepAlive: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      continue-on-error: true
