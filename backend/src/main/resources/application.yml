server:
  port: 8080

market-data:
  # Options: bitget, okx, binance, bybit, all. Tried in order.
  providers:
    - bitget

trading:
  bitget:
    enabled: ${BITGET_DEMO_ENABLED:false}
    demo: ${BITGET_DEMO_PAPER_TRADING:true}
    base-url: ${BITGET_BASE_URL:https://api.bitget.com}
    api-key: ${BITGET_DEMO_API_KEY:}
    api-secret: ${BITGET_DEMO_API_SECRET:}
    passphrase: ${BITGET_DEMO_PASSPHRASE:}
    product-type: ${BITGET_DEMO_PRODUCT_TYPE:USDT-FUTURES}
    margin-coin: ${BITGET_DEMO_MARGIN_COIN:USDT}

llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}

spring:
  application:
    name: market-opinion-tracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/market_opinion_tracker?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      continue-on-error: true
