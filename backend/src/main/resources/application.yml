server:
  port: 8080

market-data:
  # Options: bitget, okx, binance, bybit, all. Tried in order.
  providers:
    - bitget

spring:
  application:
    name: market-opinion-tracker
  datasource:
    url: jdbc:mysql://localhost:3306/market_opinion_tracker?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      continue-on-error: true
