server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

market-data:
  # Options: bitget, okx, binance, bybit, all. Tried in order.
  startup-sync-enabled: ${MARKET_DATA_STARTUP_SYNC_ENABLED:false}
  providers:
    - yahoo
    - bitget

trading:
  bitget:
    enabled: ${BITGET_DEMO_ENABLED:false}
    demo: ${BITGET_DEMO_PAPER_TRADING:true}
    base-url: ${BITGET_BASE_URL:https://api.bitget.com}
    api-key: ${BITGET_DEMO_API_KEY:}
    api-secret: ${BITGET_DEMO_API_SECRET:}
    passphrase: ${BITGET_DEMO_PASSPHRASE:}
    product-type: ${BITGET_DEMO_PRODUCT_TYPE:USDT-FUTURES}
    margin-coin: ${BITGET_DEMO_MARGIN_COIN:USDT}

llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  wxpusher-enabled: ${LLM_WXPUSHER_ENABLED:true}
  youtube-auto-import-enabled: ${LLM_YOUTUBE_AUTO_IMPORT_ENABLED:false}

spring:
  application:
    name: market-opinion-tracker
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 15000
      validation-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 120000
      keepalive-time: 30000
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 30000
        tcpKeepAlive: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      continue-on-error: true
