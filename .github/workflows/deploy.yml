name: Deploy to cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: market-prod-deploy-self-hosted
  cancel-in-progress: false

env:
  APP_URL: http://103.236.98.149:8888/market/#/youtube
  ANDROID_APK_VERSION_NAME: "1.3"
  ANDROID_APK_VERSION_CODE: "4"

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64, market-deploy]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PSExecutionPolicyPreference: Bypass
      # 可选的专用代理；实际 HTTP(S) 代理在预检后写入后续步骤环境。
      DEPLOY_HTTP_PROXY: ${{ secrets.DEPLOY_HTTP_PROXY }}
      DEPLOY_HTTPS_PROXY: ${{ secrets.DEPLOY_HTTPS_PROXY }}
      DEPLOY_NO_PROXY: ${{ secrets.DEPLOY_NO_PROXY }}
      SSH_HOST: ${{ secrets.KMT_SSH_HOST }}
      SSH_PORT: ${{ secrets.KMT_SSH_PORT }}
      SSH_USER: ${{ secrets.KMT_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.KMT_SSH_PASSWORD }}
    steps:
      - name: Check Runner access to GitHub
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @('github.com', 'api.github.com', 'codeload.github.com')
          $winHttpProxy = netsh winhttp show proxy | Out-String
          $winHttpProxyState = if ($winHttpProxy -match 'Direct access') { 'not set' } else { 'set' }
          Write-Host "WinHTTP proxy: $winHttpProxyState"
          $proxyVariables = 'HTTP_PROXY', 'HTTPS_PROXY', 'NO_PROXY', 'DEPLOY_HTTP_PROXY', 'DEPLOY_HTTPS_PROXY', 'DEPLOY_NO_PROXY'
          foreach ($name in $proxyVariables) {
            $state = if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { 'not set' } else { 'set' }
            Write-Host "Environment proxy $name : $state"
          }
          $gitProxy = git config --global --get http.proxy 2>$null
          $gitProxyState = if ([string]::IsNullOrWhiteSpace($gitProxy)) { 'not set' } else { 'set' }
          Write-Host "Git global HTTP proxy: $gitProxyState"
          foreach ($target in $targets) {
            try {
              $addresses = Resolve-DnsName -Name $target -Type A -ErrorAction Stop |
                Select-Object -ExpandProperty IPAddress -Unique
              Write-Host "DNS $target : $($addresses -join ', ')"
            } catch {
              throw "Runner DNS lookup failed for $target. Check the Runner machine DNS, VPN, or proxy configuration. $($_.Exception.Message)"
            }
          }
          $connection = Test-NetConnection -ComputerName github.com -Port 443 -WarningAction SilentlyContinue
          Write-Host "Direct TCP github.com:443 : $($connection.TcpTestSucceeded)"
          $directOk = $false
          if ($connection.TcpTestSucceeded) {
            curl.exe --noproxy '*' --fail --silent --show-error --head --connect-timeout 5 --max-time 15 https://github.com | Out-Null
            $directOk = $LASTEXITCODE -eq 0
          }
          $proxyUrl = $env:DEPLOY_HTTPS_PROXY
          if ([string]::IsNullOrWhiteSpace($proxyUrl)) { $proxyUrl = $env:DEPLOY_HTTP_PROXY }
          if (-not $directOk -and [string]::IsNullOrWhiteSpace($proxyUrl)) {
            $localProxy = Test-NetConnection -ComputerName 127.0.0.1 -Port 7897 -WarningAction SilentlyContinue
            if ($localProxy.TcpTestSucceeded) { $proxyUrl = 'http://127.0.0.1:7897' }
          }
          if (-not $directOk -and -not [string]::IsNullOrWhiteSpace($proxyUrl)) {
            curl.exe --proxy $proxyUrl --fail --silent --show-error --head --connect-timeout 5 --max-time 20 https://github.com | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Runner proxy HTTPS request to github.com failed with curl exit code $LASTEXITCODE." }
          }
          if (-not $directOk -and [string]::IsNullOrWhiteSpace($proxyUrl)) {
            throw 'Runner cannot reach github.com:443 directly and no usable deployment proxy is configured.'
          }
          $jobProxy = if ($directOk) { '' } else { $proxyUrl }
          $jobNoProxy = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_NO_PROXY)) { '' } else { $env:DEPLOY_NO_PROXY }
          $jobEnvironment = "HTTP_PROXY=$jobProxy`nHTTPS_PROXY=$jobProxy`nNO_PROXY=$jobNoProxy`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $jobEnvironment, (New-Object System.Text.UTF8Encoding($false)))
          if ($directOk) {
            Write-Host 'GitHub route selected: direct.'
          } else {
            Write-Host 'GitHub route selected: proxy.'
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy SSH client
        run: python -m pip install --disable-pip-version-check paramiko

      - name: Build and deploy
        env:
          PRICE_ALERT_WXPUSHER_SPT: ${{ secrets.DEPLOY_WXPUSHER_SPT }}
          LIVE_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIVE_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          & .\deploy\manual-release.ps1 `
            -SshHost $env:SSH_HOST `
            -SshPort ([int]$env:SSH_PORT) `
            -SshUser $env:SSH_USER `
            -SshPassword $env:SSH_PASSWORD `
            -NativeVersionCode $env:ANDROID_APK_VERSION_CODE

      - name: Prepare Android signing
        env:
          ANDROID_RELEASE_JKS_B64: ${{ secrets.ANDROID_RELEASE_JKS_B64 }}
          ANDROID_SIGNING_PROPERTIES_B64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_JKS_B64) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_SIGNING_PROPERTIES_B64)) {
            throw "Android signing secrets are missing."
          }
          $signingDir = Join-Path $env:RUNNER_TEMP 'market-opinion-android-signing'
          New-Item -ItemType Directory -Path $signingDir -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $signingDir 'android-release.jks'),
            [Convert]::FromBase64String($env:ANDROID_RELEASE_JKS_B64)
          )
          [IO.File]::WriteAllBytes(
            (Join-Path $signingDir 'android-signing.properties'),
            [Convert]::FromBase64String($env:ANDROID_SIGNING_PROPERTIES_B64)
          )
          "MOT_ANDROID_SIGNING_HOME=$signingDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and publish Android APK
        env:
          JPUSH_APP_KEY: ${{ secrets.JPUSH_APP_KEY }}
        run: |
          & .\deploy\publish-apk.ps1 `
            -SshHost $env:SSH_HOST `
            -SshPort ([int]$env:SSH_PORT) `
            -SshUser $env:SSH_USER `
            -SshPassword $env:SSH_PASSWORD `
            -VersionName $env:ANDROID_APK_VERSION_NAME `
            -VersionCode ([int]$env:ANDROID_APK_VERSION_CODE) `
            -JpushAppKey $env:JPUSH_APP_KEY

      - name: Remove Android signing files
        if: always()
        run: |
          $signingDir = Join-Path $env:RUNNER_TEMP 'market-opinion-android-signing'
          if (Test-Path $signingDir) {
            Remove-Item -LiteralPath $signingDir -Recurse -Force
          }

      - name: Verify public endpoints
        run: |
          $urls = @(
            "http://103.236.98.149:8888/market/api/health",
            "http://103.236.98.149:8888/market/",
            "http://103.236.98.149:8888/market/live-update.json",
            "http://103.236.98.149:8888/market/apk/apk.json"
          )
          foreach ($url in $urls) {
            $ok = $false
            for ($i = 1; $i -le 12; $i++) {
              curl.exe -fsS --http1.1 --max-time 20 $url > $null
              if ($LASTEXITCODE -eq 0) {
                $ok = $true
                break
              }
              Start-Sleep -Seconds 5
            }
            if (-not $ok) {
              throw "Endpoint verification failed: $url"
            }
          }
          $manifest = Invoke-RestMethod -Uri "http://103.236.98.149:8888/market/live-update.json" -TimeoutSec 20
          if (-not $manifest.bundleId -or -not $manifest.signature -or -not $manifest.url) {
            throw "Android live update manifest verification failed."
          }
          if ($manifest.nativeVersionCode -ne $env:ANDROID_APK_VERSION_CODE) {
            throw "Android live update native version verification failed."
          }
          $apk = Invoke-RestMethod -Uri "http://103.236.98.149:8888/market/apk/apk.json" -TimeoutSec 20
          if ([int]$apk.versionCode -ne [int]$env:ANDROID_APK_VERSION_CODE -or $apk.versionName -ne $env:ANDROID_APK_VERSION_NAME) {
            throw "Android APK version verification failed."
          }

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $shortSha = $env:SHA.Substring(0, 7)
          $runUrl = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
          $statusText = if ($env:JOB_STATUS -eq 'success') { 'Deploy succeeded' } else { 'Deploy failed' }
          @(
            "## $statusText"
            ""
            "- Branch: ``$($env:BRANCH)``"
            "- Commit: ``$shortSha``"
            "- Actor: ``$($env:ACTOR)``"
            "- Page: $env:APP_URL"
            "- Details: $runUrl"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Notify WxPusher
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SPT: ${{ secrets.DEPLOY_WXPUSHER_SPT }}
          APP_TOKEN: ${{ secrets.DEPLOY_WXPUSHER_APP_TOKEN }}
          UIDS: ${{ secrets.DEPLOY_WXPUSHER_UIDS }}
          TOPIC_IDS: ${{ secrets.DEPLOY_WXPUSHER_TOPIC_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPT) -and [string]::IsNullOrWhiteSpace($env:APP_TOKEN)) { exit 0 }
          $title = if ($env:JOB_STATUS -eq 'success') { 'Market deploy succeeded' } else { 'Market deploy failed' }
          $content = @"
          $title

          Status: $($env:JOB_STATUS)
          Repo: $($env:REPO)
          Branch: $($env:BRANCH)
          Commit: $($env:SHA.Substring(0, 7))
          Actor: $($env:ACTOR)
          Page: $($env:APP_URL)
          Details: https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)
          "@
          $notified = $false
          if (-not [string]::IsNullOrWhiteSpace($env:SPT)) {
            try {
              $simplePayload = @{
                spt = $env:SPT
                summary = $title.Substring(0, [Math]::Min(100, $title.Length))
                content = $content
                contentType = 1
                url = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
              } | ConvertTo-Json -Depth 4
              $simpleResponse = Invoke-RestMethod -Uri 'https://wxpusher.zjiecode.com/api/send/message/simple-push' -Method Post -ContentType 'application/json' -Body $simplePayload -TimeoutSec 15
              if ($simpleResponse.code -eq 1000) {
                $notified = $true
              } else {
                throw "code=$($simpleResponse.code); msg=$($simpleResponse.msg)"
              }
            } catch {
              Write-Host "WxPusher SPT notify failed: $($_.Exception.Message)"
            }
          }
          if (-not $notified -and -not [string]::IsNullOrWhiteSpace($env:APP_TOKEN)) {
            try {
              $uids = @()
              if (-not [string]::IsNullOrWhiteSpace($env:UIDS)) { $uids = ($env:UIDS -replace ';', ',').Split(',').Trim() | Where-Object { $_ } }
              $topicIds = @()
              if (-not [string]::IsNullOrWhiteSpace($env:TOPIC_IDS)) { $topicIds = ($env:TOPIC_IDS -replace ';', ',').Split(',').Trim() | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } }
              $payload = @{
                appToken = $env:APP_TOKEN
                summary = $title.Substring(0, [Math]::Min(100, $title.Length))
                content = $content
                contentType = 1
                uids = $uids
                topicIds = $topicIds
                url = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
              } | ConvertTo-Json -Depth 4
              $response = Invoke-RestMethod -Uri 'https://wxpusher.zjiecode.com/api/send/message' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 15
              if ($response.code -eq 1000) {
                $notified = $true
              } else {
                throw "code=$($response.code); msg=$($response.msg)"
              }
            } catch {
              Write-Host "WxPusher app-token notify failed: $($_.Exception.Message)"
            }
          }
          if (-not $notified) {
            Write-Host "WxPusher notify not confirmed."
          }
