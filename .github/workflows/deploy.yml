name: Deploy to cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: market-prod-deploy
  cancel-in-progress: false

env:
  APP_URL: http://103.236.98.149:8888/market/#/youtube

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.KMT_SSH_HOST }}
      SSH_PORT: ${{ secrets.KMT_SSH_PORT }}
      SSH_USER: ${{ secrets.KMT_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.KMT_SSH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn -DskipTests package

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /market/
        run: |
          npm ci
          npm run build

      - name: Validate frontend bundle
        run: node deploy/validate-frontend-dist.mjs frontend/dist

      - name: Package frontend
        run: tar -czf /tmp/market-opinion-frontend-dist.tar.gz -C frontend/dist .

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
          sudo apt-get update
          sudo apt-get install -y sshpass
          remote_dir=/root/market-opinion-deploy
          jar_path=backend/target/market-opinion-tracker-0.1.0.jar
          archive_path=/tmp/market-opinion-frontend-dist.tar.gz
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "mkdir -p $remote_dir"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            "$jar_path" "$SSH_USER@$SSH_HOST:$remote_dir/"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            "$archive_path" "$SSH_USER@$SSH_HOST:$remote_dir/frontend-dist.tar.gz"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/apply-release.sh deploy/ssh_http_mux.py "$SSH_USER@$SSH_HOST:$remote_dir/"
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash $remote_dir/apply-release.sh $remote_dir/market-opinion-tracker-0.1.0.jar $remote_dir/frontend-dist.tar.gz"

      - name: Verify public endpoints
        run: |
          curl -fsS "http://103.236.98.149:8888/market/api/health" >/dev/null
          curl -fsS "http://103.236.98.149:8888/market/" >/dev/null

      - name: Write summary
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $shortSha = $env:SHA.Substring(0, 7)
          $runUrl = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
          $statusText = if ($env:JOB_STATUS -eq 'success') { 'Deploy succeeded' } else { 'Deploy failed' }
          @(
            "## $statusText"
            ""
            "- Branch: ``$($env:BRANCH)``"
            "- Commit: ``$shortSha``"
            "- Actor: ``$($env:ACTOR)``"
            "- Page: $env:APP_URL"
            "- Details: $runUrl"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Notify WxPusher
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SPT: ${{ secrets.DEPLOY_WXPUSHER_SPT }}
          APP_TOKEN: ${{ secrets.DEPLOY_WXPUSHER_APP_TOKEN }}
          UIDS: ${{ secrets.DEPLOY_WXPUSHER_UIDS }}
          TOPIC_IDS: ${{ secrets.DEPLOY_WXPUSHER_TOPIC_IDS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SPT) -and [string]::IsNullOrWhiteSpace($env:APP_TOKEN)) { exit 0 }
          $title = if ($env:JOB_STATUS -eq 'success') { 'Market deploy succeeded' } else { 'Market deploy failed' }
          $content = @"
          $title

          Status: $($env:JOB_STATUS)
          Repo: $($env:REPO)
          Branch: $($env:BRANCH)
          Commit: $($env:SHA.Substring(0, 7))
          Actor: $($env:ACTOR)
          Page: $($env:APP_URL)
          Details: https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)
          "@
          $notified = $false
          if (-not [string]::IsNullOrWhiteSpace($env:SPT)) {
            try {
              $simplePayload = @{
                spt = $env:SPT
                summary = $title.Substring(0, [Math]::Min(100, $title.Length))
                content = $content
                contentType = 1
                url = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
              } | ConvertTo-Json -Depth 4
              $simpleResponse = Invoke-RestMethod -Uri 'https://wxpusher.zjiecode.com/api/send/message/simple-push' -Method Post -ContentType 'application/json' -Body $simplePayload -TimeoutSec 15
              if ($simpleResponse.code -eq 1000) {
                $notified = $true
              } else {
                throw "code=$($simpleResponse.code); msg=$($simpleResponse.msg)"
              }
            } catch {
              Write-Host "WxPusher SPT notify failed: $($_.Exception.Message)"
            }
          }
          if (-not $notified -and -not [string]::IsNullOrWhiteSpace($env:APP_TOKEN)) {
            try {
              $uids = @()
              if (-not [string]::IsNullOrWhiteSpace($env:UIDS)) { $uids = ($env:UIDS -replace ';', ',').Split(',').Trim() | Where-Object { $_ } }
              $topicIds = @()
              if (-not [string]::IsNullOrWhiteSpace($env:TOPIC_IDS)) { $topicIds = ($env:TOPIC_IDS -replace ';', ',').Split(',').Trim() | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } }
              $payload = @{
                appToken = $env:APP_TOKEN
                summary = $title.Substring(0, [Math]::Min(100, $title.Length))
                content = $content
                contentType = 1
                uids = $uids
                topicIds = $topicIds
                url = "https://github.com/$($env:REPO)/actions/runs/$($env:RUN_ID)"
              } | ConvertTo-Json -Depth 4
              $response = Invoke-RestMethod -Uri 'https://wxpusher.zjiecode.com/api/send/message' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 15
              if ($response.code -eq 1000) {
                $notified = $true
              } else {
                throw "code=$($response.code); msg=$($response.msg)"
              }
            } catch {
              Write-Host "WxPusher app-token notify failed: $($_.Exception.Message)"
            }
          }
          if (-not $notified) {
            Write-Host "WxPusher notify not confirmed."
          }
