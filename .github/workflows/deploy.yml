name: Deploy to cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Package backend
        run: mvn -DskipTests package
        working-directory: backend

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package frontend
        run: |
          npm ci
          VITE_BASE_PATH=/market/ npm run build
          tar -czf ../frontend-dist.tar.gz -C dist .
        working-directory: frontend

      - name: Upload and restart
        env:
          SSH_HOST: ${{ secrets.KMT_SSH_HOST }}
          SSH_PORT: ${{ secrets.KMT_SSH_PORT }}
          SSH_USER: ${{ secrets.KMT_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.KMT_SSH_PASSWORD }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PASSWORD" ]; then
            echo "Deployment secrets are not configured; skipping deploy."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p /root/market-opinion-deploy"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            backend/target/market-opinion-tracker-0.1.0.jar frontend-dist.tar.gz deploy/apply-release.sh \
            "$SSH_USER@$SSH_HOST:/root/market-opinion-deploy/"
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash /root/market-opinion-deploy/apply-release.sh /root/market-opinion-deploy/market-opinion-tracker-0.1.0.jar /root/market-opinion-deploy/frontend-dist.tar.gz"
