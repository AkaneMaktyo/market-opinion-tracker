name: Deploy to cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: market-prod-deploy
  cancel-in-progress: false

env:
  APP_URL: http://103.236.98.149:8888/market/#/youtube

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Package backend
        run: mvn -DskipTests package
        working-directory: backend

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package frontend
        run: |
          npm ci
          VITE_BASE_PATH=/market/ npm run build
          node ../deploy/validate-frontend-dist.mjs dist
          tar -czf "$RUNNER_TEMP/frontend-dist.tar.gz" -C dist .
        working-directory: frontend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/market-opinion-tracker-0.1.0.jar
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist.tar.gz
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, windows, x64, market-deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ${{ runner.temp }}/release

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/release

      - name: Upload and restart
        shell: powershell
        env:
          SSH_HOST: ${{ secrets.KMT_SSH_HOST }}
          SSH_PORT: ${{ secrets.KMT_SSH_PORT }}
          SSH_USER: ${{ secrets.KMT_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.KMT_SSH_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SSH_HOST) -or
              [string]::IsNullOrWhiteSpace($env:SSH_PORT) -or
              [string]::IsNullOrWhiteSpace($env:SSH_USER) -or
              [string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)) {
            throw "Missing deployment secrets."
          }
          & .\deploy\manual-release.ps1 `
            -SshHost $env:SSH_HOST `
            -SshPort ([int]$env:SSH_PORT) `
            -SshUser $env:SSH_USER `
            -SshPassword $env:SSH_PASSWORD `
            -JarPath "$env:RUNNER_TEMP\release\market-opinion-tracker-0.1.0.jar" `
            -FrontendArchivePath "$env:RUNNER_TEMP\release\frontend-dist.tar.gz" `
            -SkipBuild

      - name: Verify public endpoints
        shell: powershell
        run: |
          curl.exe -fsS "http://103.236.98.149:8888/market/api/health" > $null
          curl.exe -fsS "http://103.236.98.149:8888/market/" > $null

  notify:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      SPT: ${{ secrets.DEPLOY_WXPUSHER_SPT }}
      APP_TOKEN: ${{ secrets.DEPLOY_WXPUSHER_APP_TOKEN }}
      UIDS: ${{ secrets.DEPLOY_WXPUSHER_UIDS }}
      TOPIC_IDS: ${{ secrets.DEPLOY_WXPUSHER_TOPIC_IDS }}
    steps:
      - name: Write summary and notify
        run: |
          short_sha="${SHA::7}"
          run_url="https://github.com/$REPO/actions/runs/$RUN_ID"
          status_text="Deploy failed"
          title="Market deploy failed"
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            status_text="Deploy succeeded"
            title="Market deploy succeeded"
          fi
          {
            echo "## $status_text"
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- Commit: \`$short_sha\`"
            echo "- Actor: \`$ACTOR\`"
            echo "- Build: \`$BUILD_RESULT\`"
            echo "- Deploy: \`$DEPLOY_RESULT\`"
            echo "- Page: $APP_URL"
            echo "- Details: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${SPT:-}" ] && [ -z "${APP_TOKEN:-}" ]; then
            echo "WxPusher secrets not configured, skipping notification."
            exit 0
          fi
          content="$title

          Build: $BUILD_RESULT
          Deploy: $DEPLOY_RESULT
          Repo: $REPO
          Branch: $BRANCH
          Commit: $short_sha
          Actor: $ACTOR
          Page: $APP_URL
          Details: $run_url"
          export title content
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          def split_items(value):
              if not value:
                  return []
              return [item.strip() for item in value.replace(";", ",").split(",") if item.strip()]
          try:
              spt = os.environ.get("SPT", "")
              if spt:
                  url = "https://wxpusher.zjiecode.com/api/send/message/%s/%s" % (
                      spt,
                      urllib.parse.quote(os.environ["content"], safe=""),
                  )
                  with urllib.request.urlopen(url, timeout=15) as resp:
                      print(resp.read().decode("utf-8", "ignore"))
              elif os.environ.get("APP_TOKEN"):
                  payload = {
                      "appToken": os.environ["APP_TOKEN"],
                      "summary": os.environ["title"][:100],
                      "content": os.environ["content"],
                      "contentType": 1,
                      "uids": split_items(os.environ.get("UIDS", "")),
                      "topicIds": [int(x) for x in split_items(os.environ.get("TOPIC_IDS", "")) if x.isdigit()],
                  }
                  req = urllib.request.Request(
                      "https://wxpusher.zjiecode.com/api/send/message",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print(resp.read().decode("utf-8", "ignore"))
          except Exception as exc:
              print(f"WxPusher notify skipped: {exc}")
          PY
