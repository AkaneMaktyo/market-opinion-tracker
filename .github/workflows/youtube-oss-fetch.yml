name: YouTube OSS fetch

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIYUN_AK_ID: ${{ secrets.ALIYUN_AK_ID }}
      ALIYUN_AK_SECRET: ${{ secrets.ALIYUN_AK_SECRET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      YOUTUBE_OSS_BRIDGE_PREFIX: youtube-bridge
      YOUTUBE_FETCH_MAX_VIDEOS: "3"
      YOUTUBE_YT_DLP_EXTRA_ARGS: "--extractor-args youtube:player_client=ios,android,mweb --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      MIHOMO_CONFIG_GZ_B64: ${{ secrets.MIHOMO_CONFIG_GZ_B64 }}
      YOUTUBE_PROXY_URL: ${{ secrets.MIHOMO_CONFIG_GZ_B64 != '' && 'http://127.0.0.1:7897' || '' }}
    steps:
      - name: Checkout
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        uses: actions/checkout@v4

      - name: Skip until cookies are configured
        if: ${{ env.YOUTUBE_COOKIES_B64 == '' }}
        run: |
          echo "## YouTube OSS fetch skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub hosted runners are currently blocked by YouTube bot checks." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the YOUTUBE_COOKIES_B64 secret to enable audio downloads." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: python -m pip install --disable-pip-version-check oss2 yt-dlp bgutil-ytdlp-pot-provider

      - name: Start Mihomo proxy
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' && env.MIHOMO_CONFIG_GZ_B64 != '' }}
        run: |
          echo "$MIHOMO_CONFIG_GZ_B64" | base64 -d | gzip -d > /tmp/mihomo.yaml
          sed -i 's/^mixed-port:.*/mixed-port: 7897/' /tmp/mihomo.yaml
          sed -i 's/^external-controller:.*/external-controller: 127.0.0.1:9090/' /tmp/mihomo.yaml
          curl -fsSL -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.25/mihomo-linux-amd64-v1.19.25.gz
          gunzip -c /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          mkdir -p /tmp/mihomo-home
          nohup /tmp/mihomo -d /tmp/mihomo-home -f /tmp/mihomo.yaml > /tmp/mihomo.log 2>&1 &
          sleep 8
          curl -x http://127.0.0.1:7897 -fsS -o /dev/null --max-time 25 https://www.youtube.com/generate_204 || (tail -n 100 /tmp/mihomo.log; exit 1)

      - name: Start PO token provider
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: |
          docker run -d --name bgutil-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:1.3.1-node
          sleep 8

      - name: Fetch YouTube audio to OSS
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: python .github/scripts/youtube_oss_fetch.py
