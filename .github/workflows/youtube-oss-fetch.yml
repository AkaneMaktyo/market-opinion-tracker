name: YouTube OSS fetch

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIYUN_AK_ID: ${{ secrets.ALIYUN_AK_ID }}
      ALIYUN_AK_SECRET: ${{ secrets.ALIYUN_AK_SECRET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      YOUTUBE_OSS_BRIDGE_PREFIX: youtube-bridge
      YOUTUBE_FETCH_MAX_VIDEOS: "3"
      YOUTUBE_DOWNLOAD_TIMEOUT_SECONDS: "240"
      YOUTUBE_YT_DLP_EXTRA_ARGS: "--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      MIHOMO_CONFIG_GZ_B64: ${{ secrets.MIHOMO_CONFIG_GZ_B64 }}
      YOUTUBE_PROXY_URL: ${{ secrets.MIHOMO_CONFIG_GZ_B64 != '' && 'http://127.0.0.1:7897' || '' }}
    steps:
      - name: Checkout
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        uses: actions/checkout@v4

      - name: Skip until cookies are configured
        if: ${{ env.YOUTUBE_COOKIES_B64 == '' }}
        run: |
          echo "## YouTube OSS fetch skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub hosted runners are currently blocked by YouTube bot checks." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the YOUTUBE_COOKIES_B64 secret to enable audio downloads." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: python -m pip install --disable-pip-version-check oss2 yt-dlp bgutil-ytdlp-pot-provider

      - name: Start Mihomo proxy
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' && env.MIHOMO_CONFIG_GZ_B64 != '' }}
        run: |
          echo "$MIHOMO_CONFIG_GZ_B64" | base64 -d | gzip -d > /tmp/mihomo.yaml
          sed -i 's/^mixed-port:.*/mixed-port: 7897/' /tmp/mihomo.yaml
          sed -i 's/^external-controller:.*/external-controller: 127.0.0.1:9090/' /tmp/mihomo.yaml
          curl -fsSL -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.25/mihomo-linux-amd64-v1.19.25.gz
          gunzip -c /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          mkdir -p /tmp/mihomo-home
          nohup /tmp/mihomo -d /tmp/mihomo-home -f /tmp/mihomo.yaml > /tmp/mihomo.log 2>&1 &
          sleep 8
          python - <<'PY'
          import concurrent.futures
          import json
          import urllib.parse
          import urllib.request

          controller = "http://127.0.0.1:9090"
          group = "\u7ea2\u674f\u4e91"
          blocked = ("\u5269\u4f59\u6d41\u91cf\uff1a", "\u5957\u9910\u5230\u671f\uff1a")
          skip_types = {"Selector", "URLTest", "Fallback", "Direct", "Reject"}

          def request_json(path, timeout=5):
              with urllib.request.urlopen(controller + path, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def delay(name):
              query = urllib.parse.urlencode({
                  "timeout": "3500",
                  "url": "http://www.gstatic.com/generate_204",
              })
              path = "/proxies/" + urllib.parse.quote(name, safe="") + "/delay?" + query
              try:
                  body = request_json(path, timeout=6)
                  return body.get("delay"), name
              except Exception:
                  return None, name

          proxies = request_json("/proxies").get("proxies", {})
          group_items = proxies.get(group, {}).get("all", [])
          names = [
              name for name in group_items
              for item in [proxies.get(name, {})]
              if item.get("type") not in skip_types
              and not any(name.startswith(prefix) for prefix in blocked)
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              results = list(pool.map(delay, names))
          usable = sorted((ms, name) for ms, name in results if isinstance(ms, int))
          if not usable:
              raise SystemExit("No usable Mihomo proxy nodes passed delay test.")
          ms, selected = usable[0]
          payload = json.dumps({"name": selected}).encode("utf-8")
          path = "/proxies/" + urllib.parse.quote(group, safe="")
          request = urllib.request.Request(
              controller + path,
              data=payload,
              method="PUT",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              if response.status != 204:
                  raise SystemExit(f"Failed to select proxy: {response.status}")
          print("selected_proxy", selected.encode("unicode_escape").decode("ascii"), ms)
          PY
          curl -x http://127.0.0.1:7897 -fsS -o /dev/null --max-time 25 https://www.youtube.com/generate_204 || (tail -n 100 /tmp/mihomo.log; exit 1)

      - name: Start PO token provider
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: |
          docker run -d --name bgutil-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:1.3.1-node
          sleep 8

      - name: Fetch YouTube audio to OSS
        if: ${{ env.YOUTUBE_COOKIES_B64 != '' }}
        run: python .github/scripts/youtube_oss_fetch.py
